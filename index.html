<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Transit Baku - Prototype</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Leaflet.js CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased overflow-hidden">

    <div class="flex h-screen w-screen">
        
        <!-- SOL PANEL: İdarəetmə & Məlumatlar -->
        <aside class="w-96 bg-slate-800 border-r border-slate-700 flex flex-col justify-between p-5 z-10 shadow-2xl">
            <div class="space-y-6">
                
                <!-- Logo & Başlıq -->
                <div class="flex items-center gap-3 pb-4 border-b border-slate-700">
                    <div class="p-2.5 bg-blue-600 text-white rounded-xl shadow-lg shadow-blue-500/30">
                        <i data-lucide="bus" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg text-white leading-tight">Smart Transit</h1>
                        <p class="text-xs text-slate-400">Bakı Nəqliyyat Mühərriki Prototipi</p>
                    </div>
                </div>

                <!-- Modullar Arasında Keçid (Passenger / Operator) -->
                <div class="grid grid-cols-2 gap-1.5 bg-slate-900/80 p-1.5 rounded-xl border border-slate-700/50">
                    <button id="tab-passenger" onclick="switchTab('passenger')" class="flex items-center justify-center gap-2 py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white shadow transition-all">
                        <i data-lucide="user" class="w-4 h-4"></i> Sərnişin
                    </button>
                    <button id="tab-operator" onclick="switchTab('operator')" class="flex items-center justify-center gap-2 py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition-all">
                        <i data-lucide="activity" class="w-4 h-4"></i> Operator
                    </button>
                </div>

                <!-- ================= SƏRNIŞIN MODULU ================= -->
                <div id="view-passenger" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Avtobus Xətti</label>
                        <select id="route-select" onchange="onRouteChanged()" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs font-medium text-slate-200 focus:outline-none focus:border-blue-500"></select>
                    </div>
                    <div>
                        <label for="bus-select" class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Avtobus seçin</label>
                        <select id="bus-select" class="w-full p-3 bg-slate-900 border border-slate-700 rounded-xl text-xs font-medium text-slate-200 focus:outline-none focus:border-blue-500"></select>
                    </div>

                    <!-- Avtobus Məlumat Kartı -->
                    <div class="p-4 bg-slate-900/60 border border-slate-700/60 rounded-xl space-y-2">
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-400">Yaxınlaşan Avtobus:</span>
                            <span id="next-bus-id" class="font-mono font-bold text-blue-400">Yüklənir...</span>
                        </div>
                        <div class="flex justify-between items-center text-xs">
                            <span class="text-slate-400">Təxmini Çatma Vaxtı (ETA):</span>
                            <span id="next-bus-eta" class="font-bold text-emerald-400">Yüklənir...</span>
                        </div>
                    </div>

                    <!-- Sərnişin Sıxlıq Bildiriş Düymələri -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Avtobusdakı Sıxlığı Bildirin</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="sendCrowdReport('low')" class="flex flex-col items-center justify-center gap-1 p-3 bg-emerald-950/40 border border-emerald-800/50 text-emerald-400 font-bold rounded-xl hover:bg-emerald-900/50 active:scale-95 transition text-xs">
                                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span> Az
                            </button>
                            <button onclick="sendCrowdReport('medium')" class="flex flex-col items-center justify-center gap-1 p-3 bg-amber-950/40 border border-amber-800/50 text-amber-400 font-bold rounded-xl hover:bg-amber-900/50 active:scale-95 transition text-xs">
                                <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> Orta
                            </button>
                            <button onclick="sendCrowdReport('high')" class="flex flex-col items-center justify-center gap-1 p-3 bg-rose-950/40 border border-rose-800/50 text-rose-400 font-bold rounded-xl hover:bg-rose-900/50 active:scale-95 transition text-xs">
                                <span class="w-2.5 h-2.5 rounded-full bg-rose-400"></span> Yüksək
                            </button>
                        </div>
                        <p id="report-feedback" class="text-xs text-center mt-2 h-4 text-emerald-400 font-medium"></p>
                    </div>
                </div>

                <!-- ================= OPERATOR MODULU ================= -->
                <div id="view-operator" class="space-y-4 hidden">
                    
                    <!-- Anomaliya Xəbərdarlıq Kartı (Dinamik) -->
                    <div id="anomaly-alert-box" class="p-4 bg-rose-950/60 border-l-4 border-rose-500 rounded-r-xl space-y-2 hidden animate-pulse">
                        <div class="flex items-center gap-2 text-rose-400 font-bold text-xs uppercase tracking-wider">
                            <i data-lucide="alert-triangle" class="w-4 h-4"></i>
                            <span>Anomaliya Deteksiyası</span>
                        </div>
                        <div id="anomaly-list" class="space-y-2"></div>
                        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-rose-600 text-white text-[10px] font-bold uppercase rounded-md shadow">
                            <i data-lucide="plus-circle" class="w-3 h-3"></i> Yüksək sıxlıq
                        </div>
                    </div>

                    <!-- Operator Metrikaları -->
                    <div class="grid grid-cols-2 gap-2">
                        <div class="p-3 bg-slate-900 border border-slate-700/60 rounded-xl">
                            <span class="text-[10px] text-slate-400 uppercase font-bold">Aktiv Avtobus</span>
                            <p id="stat-active-buses" class="text-lg font-mono font-bold text-white mt-1">...</p>
                        </div>
                        <div class="p-3 bg-slate-900 border border-slate-700/60 rounded-xl">
                            <span class="text-[10px] text-slate-400 uppercase font-bold">Xəbərdarlıqlar</span>
                            <p id="stat-alerts-count" class="text-lg font-mono font-bold text-rose-400 mt-1">0</p>
                        </div>
                    </div>

                </div>

            </div>

            <!-- Footer -->
            <div class="pt-4 border-t border-slate-700/60 text-[11px] text-slate-500 text-center flex justify-between items-center">
                <span>Baku Smart Transit</span>
                <span class="px-2 py-0.5 bg-slate-700 text-slate-300 rounded font-mono">MVP Prototype</span>
            </div>
        </aside>

        <!-- SAĞ PANEL: Canlı Leaflet Xəritəsi -->
        <main class="flex-1 h-full relative">
            <div id="map" class="w-full h-full z-0"></div>
        </main>

    </div>

    <div id="app-toast" class="app-toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="app.js"></script>
</body>
</html>
